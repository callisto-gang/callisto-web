    <style>
        :root {
            --neon-blue: #00d2ff;
            --deep-dark: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(0, 210, 255, 0.3);
        }

        body {
            margin: 0;
            background: var(--deep-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Kanit', sans-serif;
            padding: 80px 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* Header */
        .header { text-align: left; border-left: 5px solid var(--neon-blue); padding-left: 20px; margin-bottom: 60px; }
        .header h1 { 
            font-family: 'Montserrat', sans-serif; font-size: clamp(2rem, 8vw, 3rem); margin: 0; 
            letter-spacing: 8px; text-transform: uppercase; color: #fff;
        }
        .header p { color: var(--neon-blue); letter-spacing: 3px; font-weight: 200; font-size: 0.9rem; margin: 5px 0; }

        /* Search - มีแว่นขยาย */
        .search-container { position: relative; width: 100%; margin-bottom: 40px; }
        .search-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; padding: 15px 45px 15px 25px; width: 100%; box-sizing: border-box;
            color: #fff; font-family: 'Kanit';
            outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: var(--neon-blue); background: rgba(0, 210, 255, 0.05); }
        .search-container i { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--neon-blue); opacity: 0.5; }

        .group-label {
            font-size: 0.75rem; letter-spacing: 5px; color: rgba(255,255,255,0.3);
            margin-bottom: 20px; display: block; font-weight: 600; text-transform: uppercase;
        }

        /* Roster Grid */
        .roster-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px; margin-bottom: 50px;
        }

        /* Animation Keyframes */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .member-item {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px; display: flex; align-items: center;
            position: relative; overflow: hidden; backdrop-filter: blur(5px);
            transition: 0.3s;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }

        .member-item:nth-child(1) { animation-delay: 0.1s; }
        .member-item:nth-child(2) { animation-delay: 0.2s; }
        .member-item:nth-child(3) { animation-delay: 0.3s; }
        .member-item:nth-child(4) { animation-delay: 0.4s; }
        .member-item:nth-child(5) { animation-delay: 0.5s; }
        .member-item:nth-child(n+6) { animation-delay: 0.6s; }

        .member-item::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 2px;
            background: var(--neon-blue); transform: scaleY(0); transition: 0.3s;
        }

        .member-item:hover {
            background: rgba(255,255,255,0.07);
            transform: translateX(8px);
            border-color: var(--border-glow);
        }

        .member-item:hover::before { transform: scaleY(1); }

        .m-avatar {
            width: 55px; height: 55px; border-radius: 2px;
            object-fit: cover; margin-right: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #000;
        }

        .m-details { flex-grow: 1; }
        .m-name { display: block; font-size: 1.05rem; font-weight: 500; color: #fff; }
        .m-role { font-size: 0.65rem; text-transform: uppercase; color: var(--neon-blue); opacity: 0.8; }
        
        .crown-icon { color: var(--neon-blue); margin-right: 5px; font-size: 0.8rem; }

        .fb-icon {
            color: rgba(255,255,255,0.15); font-size: 1.2rem; transition: 0.3s;
            padding: 10px; text-decoration: none;
        }
        .fb-icon:hover { color: #1877f2; transform: scale(1.2); }

        .status-dot {
            width: 6px; height: 6px; background: var(--neon-blue);
            border-radius: 50%; display: inline-block; margin-right: 10px;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        .simple-exit {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            transition: 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 5px;
            display: inline-block;
        }

        .simple-exit:hover {
            color: #fff;
            border-bottom: 1px solid var(--neon-blue);
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .roster-grid { grid-template-columns: 1fr; }
        }
    </style>

    <script>
