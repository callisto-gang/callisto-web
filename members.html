<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callisto Gang | Official Roster</title>
    
    <link rel="icon" type="image/png" href="https://media.discordapp.net/attachments/1378775349596520458/1450137522096177275/Beige_Black_Minimal_Simple_Modern_Handwritten_Graffiti_Typographic_Arts_and_Design_Logo_1.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Kanit:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.4);
            --card-bg: rgba(22, 27, 34, 0.5); /* ปรับให้โปร่งแสงเล็กน้อยเพื่อโชว์พื้นหลัง */
            --body-bg: #0d1117;
        }

        body {
            margin: 0;
            /* เพิ่มพื้นหลังบรรทัดนี้ */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('https://media.discordapp.net/attachments/1140155913341239297/1465387690072736056/GTA5-2025-12-02-21-53-12.png?ex=6978ec22&is=69779aa2&hm=213f02838210e656ac0c160e8974588b18b6b536e8d59af0a31886c161d13c73&=&format=webp&quality=lossless&width=968&height=968');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: white;
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            padding: 80px 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .header-section {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header-title {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff 40%, #58a6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 0 15px rgba(88, 166, 255, 0.3));
        }

        .subtitle {
            color: var(--primary-blue);
            letter-spacing: 6px;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 15px;
            font-weight: 500;
            opacity: 0.8;
        }

        /* Search Box */
        .search-wrapper {
            position: relative;
            max-width: 500px;
            margin: 0 auto 70px;
            animation: fadeIn 1s ease-in;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 60px 18px 30px;
            border-radius: 100px;
            color: white;
            font-family: 'Kanit', sans-serif;
            backdrop-filter: blur(20px);
            outline: none;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .search-input:focus {
            border-color: var(--primary-blue);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 5px var(--primary-blue);
        }

        .search-icon {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-blue);
            font-size: 1.2rem;
        }

        /* Member Grid */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
        }

        .member-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 50px 25px;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            backdrop-filter: blur(15px);
            position: relative;
            animation: cardAppear 0.8s ease-out backwards;
        }

        /* Staggered Animation Delay */
        .member-card:nth-child(1) { animation-delay: 0.1s; }
        .member-card:nth-child(2) { animation-delay: 0.2s; }
        .member-card:nth-child(3) { animation-delay: 0.3s; }
        .member-card:nth-child(4) { animation-delay: 0.4s; }
        .member-card:nth-child(5) { animation-delay: 0.5s; }
        .member-card:nth-child(n+6) { animation-delay: 0.6s; }

        .member-card:hover {
            transform: translateY(-20px) scale(1.02);
            border-color: var(--primary-blue);
            background: rgba(88, 166, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(88, 166, 255, 0.2);
        }

        .member-card.hidden { display: none; }

        /* Avatar Styling */
        .avatar-box {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            position: relative;
        }

        .avatar-box::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, var(--primary-blue), transparent);
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: 0.5s;
        }

        .member-card:hover .avatar-box::after { opacity: 1; }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1c2128;
            position: relative;
            z-index: 2;
            transition: 0.5s;
            filter: grayscale(20%);
        }

        .member-card:hover .avatar-img {
            filter: grayscale(0%);
            border-color: var(--primary-blue);
            transform: rotate(-3deg);
        }

        .member-name {
            display: block;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Social Button */
        .fb-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: #fff;
            text-decoration: none;
            transition: 0.4s;
        }

        .fb-btn:hover {
            background: #1877F2;
            transform: scale(1.25) rotate(360deg);
            border-color: transparent;
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.6);
        }

        /* Footer Navigation */
        .footer-nav {
            text-align: center;
            margin-top: 100px;
        }

        .back-link {
            text-decoration: none;
            color: #8b949e;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 40px;
            border-radius: 100px;
            transition: 0.4s;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            color: white;
            border-color: var(--primary-blue);
            background: rgba(88, 166, 255, 0.1);
            transform: translateX(-5px);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .member-grid { grid-template-columns: 1fr; }
            .header-title { letter-spacing: 6px; }
        }
    </style>
</head>

    <script>
        function filterMembers() {
            let input = document.getElementById('searchInput');
            let filter = input.value.toLowerCase();
            let items = document.getElementsByClassName('member-card');

            for (let i = 0; i < items.length; i++) {
                let name = items[i].getElementsByClassName('member-name')[0].innerText;
                if (name.toLowerCase().indexOf(filter) > -1) {
                    items[i].classList.remove('hidden');
                } else {
                    items[i].classList.add('hidden');
                }
            }
        }
    </script>
